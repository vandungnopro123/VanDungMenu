
name: Build VDUNGZ KeyGate

on:
  workflow_dispatch:
  push:
    paths:
      - 'VDUNGZKeyGate/**'
      - '.github/workflows/build-keygate.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Check project
        run: |
          test -f VDUNGZKeyGate/Makefile
          test -f VDUNGZKeyGate/Tweak.xm
          test -f VDUNGZKeyGate/control
          test -f VDUNGZKeyGate/VDUNGZKeyGate.plist

      - name: Build package
        run: |
          cd VDUNGZKeyGate
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: VDUNGZKeyGate-DEB
          path: VDUNGZKeyGate/packages/*.deb
          if-no-files-found: error
