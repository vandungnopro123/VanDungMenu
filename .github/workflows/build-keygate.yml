
name: Build VDUNGZ KeyGate

on:
  workflow_dispatch:
  push:
    paths:
      - 'VDUNGZKeyGate/**'
      - 'Makefile'
      - 'Tweak.xm'
      - 'control'
      - 'VDUNGZKeyGate.plist'
      - '.github/workflows/build-keygate.yml'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          if [ -f "VDUNGZKeyGate/Makefile" ]; then
            cd VDUNGZKeyGate
          elif [ -f "Makefile" ]; then
            cd .
          else
            echo "ERROR: Khong tim thay Makefile"
            exit 1
          fi
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: VDUNGZKeyGate
          path: '**/*.deb'
          if-no-files-found: error
