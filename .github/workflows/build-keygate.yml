
name: Build VDUNGZ KeyGate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Check files
        run: |
          echo "=== ROOT ==="
          ls -la
          if [ -f Makefile ]; then
            PROJECT="."
          elif [ -f VDUNGZKeyGate/Makefile ]; then
            PROJECT="VDUNGZKeyGate"
          else
            echo "ERROR: Khong tim thay Makefile"
            exit 1
          fi
          echo "$PROJECT" > "$RUNNER_TEMP/project_dir"

      - name: Build package
        run: |
          PROJECT=$(cat "$RUNNER_TEMP/project_dir")
          cd "$PROJECT"
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: VDUNGZKeyGate-DEB
          path: '**/*.deb'
          if-no-files-found: error
