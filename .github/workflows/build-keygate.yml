
name: Build VDUNGZ KeyGate

on:
  workflow_dispatch:
  push:
    paths:
      - 'VDUNGZKeyGate/**'
      - '.github/workflows/build-keygate.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Check project files
        run: |
          ls -la
          if [ ! -f "VDUNGZKeyGate/Makefile" ]; then
            echo "ERROR: Khong tim thay VDUNGZKeyGate/Makefile"
            exit 1
          fi

      - name: Build package
        run: |
          cd VDUNGZKeyGate
          make package FINALPACKAGE=1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDUNGZKeyGate-DEB
          path: VDUNGZKeyGate/packages/*.deb
          if-no-files-found: error
