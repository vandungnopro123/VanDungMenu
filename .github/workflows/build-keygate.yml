
name: Build VDUNGZ KeyGate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Find project
        run: |
          if [ -f Makefile ]; then
            echo "." > "$RUNNER_TEMP/project_dir"
          elif [ -f VDUNGZKeyGate/Makefile ]; then
            echo "VDUNGZKeyGate" > "$RUNNER_TEMP/project_dir"
          else
            echo "ERROR: Makefile not found"
            exit 1
          fi

      - name: Build package
        run: |
          PROJECT=$(cat "$RUNNER_TEMP/project_dir")
          cd "$PROJECT"
          make package FINALPACKAGE=1

      - name: Upload DEB and dylib
        uses: actions/upload-artifact@v4
        with:
          name: VDUNGZKeyGate-Build
          path: |
            **/*.deb
            **/*.dylib
          if-no-files-found: error
